# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the dashboard in public mode (meter identifiers hidden) with the
# DuckDB warehouse on a persistent disk. Persistent disks need a paid plan.
services:
  - type: web
    name: voltav-dashboard
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: warehouse
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: PUBLIC_MODE
        value: "true"
      - key: DB_PATH
        value: /app/data/warehouse_new.duckdb
      - key: PARQUET_PATH
        value: merged_sales_customers_clean
      - key: UPLOADS_DIR
        value: /app/data/uploads
      # The Starter instance has 512 MB. Keep DuckDB well inside it so a big
      # CSV ingest spills to the disk instead of triggering an OOM restart.
      - key: DUCKDB_MEMORY_LIMIT
        value: 200MB
      - key: DUCKDB_THREADS
        value: "2"
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Passwords colleagues type to view the dashboard. Render asks for them
      # when the Blueprint is applied; change them later in the Environment tab.
      #   VIEWER_PASSWORD  -> public view (meter / customer numbers hidden)
      #   PRIVATE_PASSWORD -> private view (identifiers visible, meter search, CSV download)
      - key: VIEWER_PASSWORD
        sync: false
      - key: PRIVATE_PASSWORD
        sync: false
      # Required in the "token" field when uploading a CSV or refreshing the
      # dataset. Copy it from the service's Environment tab.
      - key: ADMIN_TOKEN
        generateValue: true
      # Optional remote parquet export; set these in the dashboard if you have one.
      - key: BUCKET_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
