<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}VoltaV Dashboard{% endblock %}</title>

    <!-- All assets are served locally so the app works without internet access -->
    <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet" />
    {% block head_extra %}{% endblock %}
  </head>
  <body>
    <div class="container-fluid py-3">
      {% if show_logout %}
        <form method="POST" action="{{ url_for('auth.logout') }}" class="d-flex justify-content-end align-items-center gap-2 mb-2">
          <span class="badge rounded-pill text-bg-{{ 'warning' if private_session else 'secondary' }}">
            {{ 'Private view' if private_session else 'Public view' }}
          </span>
          <button class="btn btn-link btn-sm text-decoration-none" type="submit">Sign out</button>
        </form>
      {% endif %}
      {% if flashes %}
        {% for category, message in flashes %}
          <div class="alert alert-{{ category or 'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
      {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}" defer></script>
    <script src="{{ url_for('static', filename='vendor/chart.umd.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/chartjs-plugin-datalabels.min.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
