name: Package Into One Click

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  # macOS public
  build-macos-public:
    runs-on: macos-latest
    env:
      BUCKET_URL: ${{ secrets.BUCKET_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PUBLIC_MODE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          xcode-select --install || true
          brew install cmake
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller python-dotenv
      - name: Create .env
        run: |
          echo "BUCKET_URL=${BUCKET_URL}" > .env
          echo "SUPABASE_KEY=${SUPABASE_KEY}" >> .env
          echo "PUBLIC_MODE=${PUBLIC_MODE}" >> .env
      - name: Build Mac executable
        run: |
          source .venv/bin/activate
          pyinstaller \
            --onefile \
            --name volta_macos_public \
            --add-data "volta/templates:volta/templates" \
            --add-data "volta/static:volta/static" \
            --add-data ".env:." \
            --copy-metadata duckdb \
            run.py
      - uses: actions/upload-artifact@v4
        with:
          name: volta-macos-public
          path: dist/volta_macos_public

  # macOS private
  build-macos-private:
    runs-on: macos-latest
    env:
      BUCKET_URL: ${{ secrets.BUCKET_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PUBLIC_MODE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller python-dotenv
      - name: Create .env
        run: |
          echo "BUCKET_URL=${BUCKET_URL}" > .env
          echo "SUPABASE_KEY=${SUPABASE_KEY}" >> .env
          echo "PUBLIC_MODE=${PUBLIC_MODE}" >> .env
      - name: Build Mac executable
        run: |
          source .venv/bin/activate
          pyinstaller \
            --onefile \
            --name volta_macos_private \
            --add-data "volta/templates:volta/templates" \
            --add-data "volta/static:volta/static" \
            --add-data ".env:." \
            --copy-metadata duckdb \
            run.py
      - uses: actions/upload-artifact@v4
        with:
          name: volta-macos-private
          path: dist/volta_macos_private

  # Windows public
  build-windows-public:
    runs-on: windows-latest
    env:
      BUCKET_URL: ${{ secrets.BUCKET_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PUBLIC_MODE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install pyinstaller python-dotenv
      - name: Create .env
        run: |
          echo "BUCKET_URL=${{ secrets.BUCKET_URL }}" > .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "PUBLIC_MODE=${PUBLIC_MODE}" >> .env
      - name: Build Windows executable
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller `
            --onefile `
            --name volta_windows_public `
            --add-data "volta/templates;volta/templates" `
            --add-data "volta/static;volta/static" `
            --add-data ".env;." `
            --copy-metadata duckdb `
            run.py
      - uses: actions/upload-artifact@v4
        with:
          name: volta-windows-public
          path: dist/volta_windows_public.exe

  # Windows private
  build-windows-private:
    runs-on: windows-latest
    env:
      BUCKET_URL: ${{ secrets.BUCKET_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PUBLIC_MODE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install pyinstaller python-dotenv
      - name: Create .env
        run: |
          echo "BUCKET_URL=${{ secrets.BUCKET_URL }}" > .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "PUBLIC_MODE=${PUBLIC_MODE}" >> .env
      - name: Build Windows executable
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller `
            --onefile `
            --name volta_windows_private `
            --add-data "volta/templates;volta/templates" `
            --add-data "volta/static;volta/static" `
            --add-data ".env;." `
            --copy-metadata duckdb `
            run.py
      - uses: actions/upload-artifact@v4
        with:
          name: volta-windows-private
          path: dist/volta_windows_private.exe