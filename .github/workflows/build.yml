name: Package Into One Click

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Fast check on every PR and push: boots the app against a synthetic dataset.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q tests
      - name: Build the Docker image and probe it
        run: |
          docker build -t voltav .
          docker run -d --name voltav -p 5000:5000 -e PUBLIC_MODE=true -e ADMIN_TOKEN=ci voltav
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:5000/health | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5000/try_connection)" = "403"
          docker logs voltav

  build-macos-public:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    env:
      BUCKET_URL: ${{ secrets.BUCKET_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PUBLIC_MODE: True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          xcode-select --install || true
          brew install cmake
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller python-dotenv
      - name: Create .env
        run: |
          echo "PARQUET_PATH=merged_sales_customers_clean" >> .env
          echo "PUBLIC_MODE=${PUBLIC_MODE}" >> .env
          echo "DB_PATH=data/warehouse_new.duckdb" >> .env
      - name: Build Mac executable
        run: |
          source .venv/bin/activate
          mkdir -p data
          pyinstaller \
            --onefile \
            --name volta_macos_public \
            --add-data "volta/templates:volta/templates" \
            --add-data "volta/static:volta/static" \
            --add-data ".env:." \
            --add-data "data:./data" \
            --copy-metadata duckdb \
            run.py
      - uses: actions/upload-artifact@v4
        with:
          name: volta-macos-public
          path: dist/volta_macos_public

  # macOS private
  build-macos-private:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    env:
      BUCKET_URL: ${{ secrets.BUCKET_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PUBLIC_MODE: False
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller python-dotenv
      - name: Create .env
        run: |
          echo "PARQUET_PATH=merged_sales_customers_clean" >> .env
          echo "PUBLIC_MODE=${PUBLIC_MODE}" >> .env
          echo "DB_PATH=data/warehouse_new.duckdb" >> .env
      - name: Build Mac executable
        run: |
          source .venv/bin/activate
          mkdir -p data
          pyinstaller \
            --onefile \
            --name volta_macos_private \
            --add-data "volta/templates:volta/templates" \
            --add-data "volta/static:volta/static" \
            --add-data ".env:." \
            --add-data "data:./data" \
            --copy-metadata duckdb \
            run.py
      - uses: actions/upload-artifact@v4
        with:
          name: volta-macos-private
          path: dist/volta_macos_private

  # Windows public
  build-windows-public:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      BUCKET_URL: ${{ secrets.BUCKET_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PUBLIC_MODE: True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install pyinstaller python-dotenv
      - name: Create .env
        run: |
          echo "PARQUET_PATH=merged_sales_customers_clean" >> .env
          echo "PUBLIC_MODE=${PUBLIC_MODE}" >> .env
          echo "DB_PATH=data/warehouse_new.duckdb" >> .env
      - name: Build Windows executable
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          .\.venv\Scripts\python.exe -m PyInstaller `
            --onefile `
            --name volta_windows_public `
            --add-data "volta/templates;volta/templates" `
            --add-data "volta/static;volta/static" `
            --add-data ".env;." `
            --add-data "data;data" `
            --copy-metadata duckdb `
            run.py
      - uses: actions/upload-artifact@v4
        with:
          name: volta-windows-public
          path: dist/volta_windows_public.exe

  # Windows private
  build-windows-private:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      BUCKET_URL: ${{ secrets.BUCKET_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PUBLIC_MODE: False
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install pyinstaller python-dotenv
      - name: Create .env
        run: |
          echo "PARQUET_PATH=merged_sales_customers_clean" >> .env
          echo "PUBLIC_MODE=${PUBLIC_MODE}" >> .env
          echo "DB_PATH=data/warehouse_new.duckdb" >> .env
      - name: Build Windows executable
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          .\.venv\Scripts\python.exe -m PyInstaller `
            --onefile `
            --name volta_windows_private `
            --add-data "volta/templates;volta/templates" `
            --add-data "volta/static;volta/static" `
            --add-data ".env;." `
            --add-data "data;data" `
            --copy-metadata duckdb `
            run.py
      - uses: actions/upload-artifact@v4
        with:
          name: volta-windows-private
          path: dist/volta_windows_private.exe